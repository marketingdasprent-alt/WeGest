# Sincronização de UMA semana pela API oficial da Bolt (getFleetOrders).
# Escreve no financeiro (bolt_resumos_semanais), por isso exige JWT válido:
# a chave service_role do agendador já é um JWT assinado pelo projecto e passa
# na verificação, tal como a sessão do administrador que carrega no botão.
# Deixá-la a false abria um gatilho anónimo para uma função que consome quota
# da API da Bolt e reescreve valores financeiros. A autorização a sério é feita
# dentro da função (service-role OU admin da org dona da integração).
[functions.bolt-sync-semana]
verify_jwt = true

# Enfileira o sync semanal. Chamada pelo cron (service-role) e pelo botão
# "Atualizar" (sessão do utilizador) — daí verify_jwt = false: a própria
# função distingue os dois e exige admin da org ao chamador autenticado.
[functions.bolt-sync-agendado]
verify_jwt = false

