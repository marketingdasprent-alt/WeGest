name: 🚀 CI Pipeline

on:
  push:
    # teste-fluxo incluído: é o branch de trabalho partilhado — pushes directos
    # (sem PR) também têm de passar pelo gate.
    branches: [main, develop, teste-fluxo]
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: 🎨 Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  type-check:
    name: 🔎 Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deno-test:
    name: 🦕 Deno Tests (Edge Functions)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno test --allow-read supabase/functions/_shared

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  rls-test:
    name: 🛡️ RLS (pgTAP)
    runs-on: ubuntu-latest

    # Só os dois testes de segurança, de propósito. Há ~35 ficheiros pgTAP em
    # supabase/tests/ e nenhum corria em CI até agora; ligá-los todos de uma vez
    # arriscava vermelho por falhas pré-existentes e não verificadas. Estes dois
    # são o guarda estrutural: falham para QUALQUER tabela nova que nasça sem
    # isolamento de org ou sem rls_deny_anon.
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Arrancar a base de dados local
        run: supabase db start

      # `db start` arranca o Postgres; é o `db reset` que aplica as migrações.
      # Sem este passo os testes correriam contra um schema vazio e falhariam
      # por ausência de tabelas, não por regressão de segurança.
      # --no-seed: um seed em falha não deve pintar de vermelho um teste de RLS.
      - name: Aplicar as migrações
        run: supabase db reset --no-seed

      - name: Isolamento anónimo e escalada de privilégios
        run: supabase test db supabase/tests/rls_anon_exposure.test.sql

      - name: Isolamento entre organizações
        run: supabase test db supabase/tests/rls_org_isolation.test.sql
