name: 🚀 CI Pipeline

on:
  push:
    # teste-fluxo incluído: é o branch de trabalho partilhado — pushes directos
    # (sem PR) também têm de passar pelo gate.
    branches: [main, develop, teste-fluxo]
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: 🎨 Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  type-check:
    name: 🔎 Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deno-test:
    name: 🦕 Deno Tests (Edge Functions)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno test --allow-read supabase/functions/_shared

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════
  # Reconstrução da base de dados + pgTAP
  # ══════════════════════════════════════════════════════════════════════════
  # Existe desde 2026-08-28. Substitui a nota que dizia que este gate não podia
  # existir porque "a cadeia de migrações não reproduz a base de produção".
  # As duas causas concretas disso foram identificadas e resolvidas:
  #
  #   1. 59 carimbos de versão duplicados entre ficheiros de migração, contra
  #      uma PRIMARY KEY (version) em schema_migrations → o reset abortava.
  #   2. ~280 migrações escritas contra uma base que já tinha o estado, e que
  #      por isso não se aplicam de zero.
  #
  # Ambas deixam de existir com o cutover para baseline (scripts/baseline-cutover.sh):
  # o ponto de partida passa a ser um retrato do schema real, e o histórico fica
  # arquivado fora do caminho do CLI.
  #
  # Este job é um GATE a sério — sem continue-on-error e sem workflow_dispatch.
  # Um job permanentemente amarelo que ninguém lê é o anti-padrão que a auditoria
  # de 2026-07-29 apontou nos crons ("66% das invocações falham e 100% ficam
  # registadas como sucesso"). Ou passa, ou trava o merge.
  db-tests:
    name: 🗄️ DB Rebuild + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # ── Que código está mesmo a ser testado ───────────────────────────
      # Duas execuções seguidas deste gate reportaram erros em linhas que já
      # tinham sido corrigidas. Eram re-execuções do MESMO commit: o botão
      # "Re-run jobs" repete o SHA original, não vai buscar o topo do ramo.
      # Só o "Run workflow" (workflow_dispatch) ou um push novo o fazem.
      #
      # Diagnosticar isso custou duas rondas porque a saída do gate não diz de
      # que código veio. Passa a dizer — no log e no painel — para que qualquer
      # saída colada se identifique sozinha.
      - name: Commit em teste
        run: |
          ASSUNTO=$(git log -1 --format='%s')
          {
            echo "### 🔖 Commit em teste"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| SHA | \`${{ github.sha }}\` |"
            echo "| Assunto | $ASSUNTO |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Evento | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "═══ Commit em teste ═══"
          echo "SHA:     ${{ github.sha }}"
          echo "Assunto: $ASSUNTO"
          echo "Ref:     ${{ github.ref_name }}   Evento: ${{ github.event_name }}"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── Estado de arranque ────────────────────────────────────────────
      # Este gate depende de um baseline que é gerado por OUTRO workflow
      # (🧱 Gerar baseline do schema), e esse só fica disponível depois de
      # chegar ao ramo por omissão. Se este passo falhasse por o baseline não
      # existir, o PR que traz o próprio workflow ficaria vermelho e nunca
      # poderia entrar — um impasse.
      #
      # Por isso: sem baseline o job passa e DIZ que está inactivo; com
      # baseline corre a sério e falha a sério. É um estado de arranque que se
      # resolve numa única execução, não um job cronicamente amarelo — a
      # diferença face ao anti-padrão dos crons de 2026-07-29 é que aqui o
      # estado degradado é visível, nomeado, e tem um fim conhecido.
      - name: Verificar que o cutover para baseline foi feito
        id: baseline
        run: |
          if [ -f supabase/migrations/00000000000000_baseline.sql ]; then
            echo "tem_baseline=true" >> "$GITHUB_OUTPUT"
            echo "✓ baseline presente — o gate está activo"
            exit 0
          fi

          echo "tem_baseline=false" >> "$GITHUB_OUTPUT"

          N_FICH=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')
          N_DUP=$(find supabase/migrations -maxdepth 1 -name '*.sql' | sed 's|.*/||; s|_.*||' | sort | uniq -d | wc -l | tr -d ' ')

          echo "::warning::Gate de base de dados INACTIVO — falta gerar o baseline."

          {
            echo "### ⚠️ Gate de base de dados inactivo"
            echo ""
            echo "Os testes de base de dados **não correram**: falta"
            echo "\`supabase/migrations/00000000000000_baseline.sql\`."
            echo ""
            echo "Enquanto ele não existir, a base não é reconstruível a partir deste"
            echo "repositório — são **$N_FICH ficheiros** de migração com **$N_DUP carimbos de versão"
            echo "duplicados**, contra uma \`PRIMARY KEY (version)\` em \`schema_migrations\`."
            echo ""
            echo "**Para activar o gate**, depois deste PR entrar em \`main\`:"
            echo ""
            echo "1. *Settings → Secrets and variables → Actions* → criar \`SUPABASE_DB_URL\`"
            echo "2. *Actions → 🧱 Gerar baseline do schema → Run workflow*"
            echo "3. Fazer merge do ramo \`chore/baseline-schema\` que ele cria"
            echo ""
            echo "Ver \`docs/motor-automacao/reconstrucao-migracoes.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Falha cedo e com uma mensagem legível se alguém reintroduzir um carimbo
      # duplicado. Mais barato do que descobri-lo no meio do reset.
      - name: Verificar carimbos de versão únicos
        if: steps.baseline.outputs.tem_baseline == 'true'
        run: |
          DUPS=$(find supabase/migrations -maxdepth 1 -name '*.sql' | sed 's|.*/||; s|_.*||' | sort | uniq -d)
          if [ -n "$DUPS" ]; then
            echo "::error::Carimbos de versão duplicados em supabase/migrations:"
            echo "$DUPS"
            echo "schema_migrations tem PRIMARY KEY (version): dois ficheiros com o mesmo"
            echo "carimbo tornam a cadeia inaplicável. Renomeia um deles."
            exit 1
          fi
          echo "✓ todos os carimbos são únicos"

      # `db start` aplica o baseline e todas as migrações que vieram depois.
      # É aqui que uma migração nova partida se revela.
      - name: Reconstruir a base de dados do zero
        if: steps.baseline.outputs.tem_baseline == 'true'
        run: supabase db start

      # ── Gate 1: o motor de automação ──────────────────────────────────
      # Estes são os testes que cobrem o comportamento do motor. Antes de
      # 2026-08-28 existiam e nunca corriam — foi assim que um erro de
      # v_run/v_rule em execute_automation_runs ficou latente no repositório
      # durante 27 dias sem ninguém reparar.
      - name: pgTAP — motor de automação
        if: steps.baseline.outputs.tem_baseline == 'true'
        run: |
          bash scripts/pgtap-suite.sh "Motor de automação" \
            process_domain_events \
            domain_events_claim \
            execute_automation_runs \
            idempotencia_efeitos \
            snapshot_da_regra \
            motor_de_condicoes \
            accoes_internas \
            accao_email \
            notifications_destinatario_externo \
            automation_rules_grupo_id \
            email_gemea_herda_grupo_id \
            testar_regra_automacao \
            automation_queue \
            automation_rules \
            automation_runs_complete_duracao \
            executar_jobs_automacao_manualmente \
            seed_automacao_defaults \
            automacao_saude_ignorar_failed_job \
            automacao_timeline_views \
            retry_failed_job

      # ── Gate 2: notificações ──────────────────────────────────────────
      - name: pgTAP — notificações
        if: steps.baseline.outputs.tem_baseline == 'true'
        run: |
          bash scripts/pgtap-suite.sh "Notificações" \
            notifications \
            notification_queue \
            limite_diario_emails \
            enviar_digests_diarios

      # ── Gate 3: isolamento e exposição ────────────────────────────────
      # Estes dois são estruturais: falham para QUALQUER tabela ou função nova
      # que nasça sem isolamento de org ou executável pelo papel anónimo.
      - name: pgTAP — segurança e multi-tenancy
        if: steps.baseline.outputs.tem_baseline == 'true'
        run: |
          bash scripts/pgtap-suite.sh "Segurança e multi-tenancy" \
            rls_org_isolation \
            rls_anon_exposure

      # ── Gate 4: concorrência a sério ──────────────────────────────────
      # Não é pgTAP de propósito: os ficheiros pgTAP correm dentro de
      # `begin ... rollback`, e uma segunda ligação não vê fixtures por
      # confirmar. Dois workers a competir exigem dados commitados e dois
      # processos — ver o cabeçalho do script.
      #
      # Fecha a lacuna que as Fases 1 a 4 deixaram marcada como INFERIDO: o
      # `for update skip locked` estava certo por leitura, nunca por observação.
      - name: Concorrência — dois workers
        if: steps.baseline.outputs.tem_baseline == 'true'
        run: bash scripts/teste-concorrencia.sh

      - name: Parar a base de dados
        if: always() && steps.baseline.outputs.tem_baseline == 'true'
        run: supabase stop --no-backup || true

  # Os restantes ficheiros pgTAP de supabase/tests/ NÃO correm aqui ainda.
  # Não por decisão de qualidade — por sequência: promovem-se um a um, à medida
  # que passam, para que uma falha antiga não torne o gate ruído. A lista do que
  # falta promover está em docs/motor-automacao/reconstrucao-migracoes.md.
