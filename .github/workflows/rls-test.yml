name: 🛡️ pgTAP completo (a pedido)

# ESTE JOB NÃO É O GATE.
#
# O gate vive em `ci.yml`, job "🗄️ DB Rebuild + pgTAP", e corre em todos os
# pushes e pull requests desde 2026-08-28. Cobre o motor de automação, as
# notificações e os dois testes estruturais de segurança.
#
# Este ficheiro serve outra coisa: correr a suite pgTAP INTEIRA — os 41
# ficheiros de supabase/tests/ — para descobrir o que ainda não está pronto a
# ser promovido para o gate. É deliberadamente `workflow_dispatch`, porque o
# resultado esperado é vermelho enquanto houver ficheiros por arranjar, e um
# gate que se espera vermelho não é um gate.
#
# COMO USAR
#   1. Corre este workflow à mão.
#   2. Escolhe um ficheiro que falhe, percebe porquê, arranja.
#   3. Promove-o para a lista do job db-tests em ci.yml.
#   4. Repete.
#
# O objectivo é este ficheiro ficar sem razão de existir.
#
# ── Histórico ────────────────────────────────────────────────────────────────
# Até 2026-08-28 este ficheiro explicava que nenhum teste de base de dados podia
# correr em CI, porque `supabase db start` não conseguia reconstruir a base a
# partir das migrações. Estava certo. As duas causas eram:
#
#   · 59 carimbos de versão duplicados contra PRIMARY KEY (version) em
#     schema_migrations;
#   · ~280 migrações escritas contra uma base que já tinha o estado.
#
# Ambas foram resolvidas pelo cutover para baseline
# (scripts/baseline-cutover.sh). A nota antiga ficou obsoleta e foi substituída.

on:
  workflow_dispatch:

jobs:
  pgtap-completo:
    name: 🛡️ pgTAP completo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verificar que o cutover para baseline foi feito
        run: |
          if [ ! -f supabase/migrations/00000000000000_baseline.sql ]; then
            echo "::error::Sem baseline não há reconstrução. Ver scripts/baseline-cutover.sh"
            exit 1
          fi

      - name: Reconstruir a base de dados do zero
        run: supabase db start

      # Sem lista: corre tudo o que existe em supabase/tests/.
      # `|| true` de propósito — o valor está no relatório, não no exit code.
      - name: Correr todos os ficheiros pgTAP
        run: |
          echo "## Resultado por ficheiro" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ficheiro | Resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in supabase/tests/*.test.sql; do
            if supabase test db "$f" >/dev/null 2>&1; then
              echo "| \`$(basename "$f")\` | ✅ passa |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$(basename "$f")\` | ❌ falha |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Parar a base de dados
        if: always()
        run: supabase stop --no-backup || true
