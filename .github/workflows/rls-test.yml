name: 🛡️ RLS (pgTAP)

# A PEDIDO, de propósito — não é um gate de CI. Leia o porquê antes de o ligar
# ao `push`/`pull_request`.
#
# ESTADO: 2026-07-30. Este workflow correu uma vez e falhou, e não foi nas
# asserções — falhou a RECONSTRUIR a base de dados:
#
#   Applying migration 20250811122918_0a61e2ff-....sql...
#   ERROR: column "formulario_id" does not exist (SQLSTATE 42703)
#
# Investigado: `leads_dasprent.formulario_id` EXISTE em produção (uuid) e
# NENHUMA migração a cria — foi acrescentada fora do sistema de migrações. Essa
# migração de 2025-08-11 é um backfill escrito contra a produção, que já tinha a
# coluna. Ficou envolvida num guarda de existência (ver o comentário no próprio
# ficheiro), o que evita o crash, mas não resolve o problema de fundo:
#
#   **um schema construído a partir das migrações é estruturalmente diferente da
#   produção**, por isso não é um alvo válido para asserções de segurança.
#
# Um teste que corre contra uma realidade que não existe dá falsos negativos —
# que é pior do que não correr, porque parece cobertura. Daí ficar a pedido, e
# não em `continue-on-error: true`: um job permanentemente amarelo e ignorado é
# exactamente o anti-padrão que a auditoria de 29-07 apontou nos crons ("66% das
# invocações falham e 100% ficam registadas como sucesso").
#
# PARA O TORNAR UM GATE, por esta ordem:
#   1. Fechar a divergência de schema. `supabase db reset` numa base limpa tem de
#      produzir o mesmo schema que a produção. O caminho prático é comparar os
#      dois e escrever uma migração de reconciliação com o que falta
#      (a começar por leads_dasprent.formulario_id).
#   2. Correr este workflow à mão até passar. Podem aparecer mais casos como o de
#      2025-08-11; são ~660 migrações e esta foi a 4.ª.
#   3. Só então mover o job de volta para ci.yml, em `push` e `pull_request`.
#
# Corre só os dois testes de segurança. Há ~35 ficheiros pgTAP em
# supabase/tests/ e nenhum corria em CI; ligá-los todos de uma vez arriscava
# vermelho por falhas pré-existentes não investigadas. Estes dois são o guarda
# estrutural: falham para QUALQUER tabela ou função nova que nasça sem
# isolamento de org, sem rls_deny_anon, ou executável pelo papel anónimo.

on:
  workflow_dispatch:

jobs:
  rls-test:
    name: 🛡️ RLS (pgTAP)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `db start` já aplica as migrações — é aqui que falha hoje.
      - name: Arrancar a base de dados local e aplicar as migrações
        run: supabase db start

      - name: Isolamento anónimo e escalada de privilégios
        run: supabase test db supabase/tests/rls_anon_exposure.test.sql

      - name: Isolamento entre organizações
        run: supabase test db supabase/tests/rls_org_isolation.test.sql
